<!doctype html>
<html lang="ka">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#081b3d" />
  <title>U.S. Consulate Game</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#071a39;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#fff}body{display:flex;flex-direction:column}.topbar{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;max-width:1280px;width:100%;margin:auto}.brand{font-weight:950;letter-spacing:.02em}.back{color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.25);padding:10px 14px;border-radius:12px;background:rgba(255,255,255,.08)}main{width:100%;max-width:1280px;margin:auto;padding:0 14px 30px}.game-shell{position:relative;background:#0a2757;border:1px solid rgba(255,255,255,.16);border-radius:22px;overflow:hidden;box-shadow:0 28px 70px rgba(0,0,0,.32)}#game{width:100%;aspect-ratio:16/9;min-height:560px}.help{position:absolute;left:16px;right:16px;bottom:14px;z-index:30;display:flex;justify-content:space-between;align-items:center;gap:12px;pointer-events:none}.mission,.controls{background:rgba(5,22,48,.9);border:1px solid rgba(255,255,255,.15);border-radius:13px;padding:11px 14px;font-weight:850;backdrop-filter:blur(8px)}.controls{font-size:13px;color:#cbd9ee}.loading{position:absolute;inset:0;display:grid;place-items:center;background:#071a39;z-index:50;font-size:18px;font-weight:900}.loading.hidden{display:none}@media(max-width:760px){.topbar{height:56px}.brand{font-size:14px}.back{font-size:13px;padding:8px 10px}.help{flex-direction:column;align-items:stretch}.controls{text-align:center}#game{min-height:620px;aspect-ratio:auto}}
  </style>
</head>
<body>
  <header class="topbar"><div class="brand">🇺🇸 USA VISA HELP — CONSULATE GAME</div><a class="back" href="/">მთავარ გვერდზე</a></header>
  <main>
    <section class="game-shell">
      <div id="game"></div>
      <div class="help"><div id="mission" class="mission">მისია: მიდი საკონსულოს შესასვლელთან</div><div class="controls">მართვა: ← → / A D • მოქმედება: E</div></div>
      <div id="loading" class="loading">თამაში იტვირთება...</div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script src="game.js"></script>
</body>
</html>
