<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<meta name="theme-color" content="#071a39" />
<title>3D U.S. Consulate Simulator</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06152f;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#fff}#game{position:fixed;inset:0}.hud{position:fixed;inset:0;z-index:10;pointer-events:none}.top{position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;gap:12px}.brand,.mission,.hint,.dialog,.error{background:rgba(4,18,40,.88);border:1px solid rgba(255,255,255,.15);backdrop-filter:blur(12px);box-shadow:0 14px 34px rgba(0,0,0,.25)}.brand{padding:11px 14px;border-radius:14px;font-weight:950}.mission{padding:11px 14px;border-radius:14px;font-weight:800;max-width:520px}.hint{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);padding:11px 16px;border-radius:999px;font-weight:850;text-align:center}.dialog{pointer-events:auto;position:absolute;left:50%;bottom:24px;transform:translateX(-50%);width:min(720px,calc(100% - 28px));padding:18px;border-radius:18px;display:none}.dialog.show{display:block}.dialog h3{margin:0 0 8px}.dialog p{margin:0 0 14px;color:#dbe7f7;line-height:1.5}.answers{display:grid;grid-template-columns:1fr 1fr;gap:9px}.answer{pointer-events:auto;border:1px solid rgba(255,255,255,.16);background:#fff;color:#163252;border-radius:12px;padding:12px 13px;font-weight:800;text-align:left;cursor:pointer}.loading{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:#06152f;font-size:19px;font-weight:950}.loading.hide{display:none}.fade{position:fixed;inset:0;z-index:40;background:#020814;opacity:0;pointer-events:none;transition:.35s}.fade.show{opacity:1}.mobile{display:none;position:absolute;right:16px;bottom:16px;gap:10px;pointer-events:auto}.pad{width:58px;height:58px;border:1px solid rgba(255,255,255,.2);background:rgba(5,22,48,.8);color:#fff;border-radius:16px;font-size:24px;font-weight:900}.interact{width:auto;padding:0 18px}.error{display:none;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:18px;border-radius:16px;max-width:620px;text-align:center;pointer-events:auto}.error.show{display:block}@media(max-width:800px){.top{flex-direction:column;align-items:stretch}.mission{max-width:none}.mobile{display:flex}.hint{bottom:86px}.answers{grid-template-columns:1fr}.brand{font-size:13px}}
</style>
</head>
<body>
<div id="game"></div>
<div class="hud">
  <div class="top"><div class="brand">🇺🇸 USA VISA HELP — 3D CONSULATE</div><div id="mission" class="mission">მისია: მიდი საკონსულოს შესასვლელთან</div></div>
  <div id="hint" class="hint">WASD / ისრები — მოძრაობა • E — მოქმედება</div>
  <div id="dialog" class="dialog"><h3 id="dialogTitle"></h3><p id="dialogText"></p><div id="answers" class="answers"></div></div>
  <div id="error" class="error"></div>
  <div class="mobile"><button id="left" class="pad">←</button><button id="right" class="pad">→</button><button id="action" class="pad interact">E</button></div>
</div>
<div id="fade" class="fade"></div>
<div id="loading" class="loading">3D გარემო იტვირთება...</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.min.js"></script>
<script src="game.js"></script>
</body>
</html>
